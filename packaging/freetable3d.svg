    <path d="M202 286Q151 267 120 225Q109 208 101 214Q94 221 105 250Q122 291 160 313Q187 327 218 310Z" fill="#101722"/>
    <path d="M309 286Q360 267 391 225Q402 208 410 214Q417 221 406 250Q389 291 351 313Q324 327 293 310Z" fill="#101722"/>
