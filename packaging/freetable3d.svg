    <ellipse cx="256" cy="278" rx="83" ry="118" fill="#0c111a"/>
    <ellipse cx="256" cy="302" rx="57" ry="90" fill="url(#belly)" stroke="none"/>
    <!-- head -->
    <circle cx="256" cy="201" r="65" fill="#101722"/>
    <!-- eyes -->
    <ellipse cx="231" cy="193" rx="21" ry="29" fill="#fff" stroke="none" transform="rotate(-8 231 193)"/>
    <ellipse cx="281" cy="193" rx="21" ry="29" fill="#fff" stroke="none" transform="rotate(8 281 193)"/>
    <ellipse cx="234" cy="194" rx="8" ry="13" fill="#05070b" stroke="none"/>
    <ellipse cx="278" cy="194" rx="8" ry="13" fill="#05070b" stroke="none"/>
    <circle cx="236" cy="188" r="3.5" fill="#fff" stroke="none"/><circle cx="280" cy="188" r="3.5" fill="#fff" stroke="none"/>
    <!-- beak -->
    <path d="M208 223Q256 208 304 223Q291 244 256 245Q222 245 208 223Z" fill="#ffcf30" stroke="#e69a00" stroke-width="4"/>
    <!-- feet -->
    <path d="M224 385Q208 398 195 405Q211 416 239 410L256 402 273 410Q301 416 317 405Q304 398 288 385Z" fill="#ffb52d" stroke="#e88b12" stroke-width="4"/>
  </g>
  <!-- foreground title plate -->
  <g filter="url(#shadow)">
    <rect x="48" y="405" width="416" height="76" rx="25" fill="#06152c" stroke="#1687ff" stroke-width="7"/>
    <rect x="57" y="414" width="398" height="58" rx="18" fill="#0a2346" stroke="#3bb9ff" stroke-width="2"/>
  </g>
  <text x="256" y="456" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="-1"><tspan fill="#f7fbff">freetable</tspan><tspan fill="#35c7ff">3d</tspan></text>
</svg>
