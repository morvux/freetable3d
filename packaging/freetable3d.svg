<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123e86"/><stop offset="1" stop-color="#06152f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#54c7ff"/><stop offset="1" stop-color="#1265d9"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7777"/><stop offset="1" stop-color="#d91b37"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6ff68"/><stop offset="1" stop-color="#30b64e"/></linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9e5f7"/></linearGradient>
    <clipPath id="inside"><circle cx="256" cy="244" r="218"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- circular badge -->
  <circle cx="256" cy="244" r="232" fill="#071b38" stroke="#1678ef" stroke-width="12"/>
  <circle cx="256" cy="244" r="218" fill="url(#badge)" stroke="#5ab9ff" stroke-width="3"/>
  <!-- CAD grid -->
  <g clip-path="url(#inside)" opacity=".42" fill="none" stroke="#56baff" stroke-width="2">
    <path d="M35 120H477 M24 164H488 M15 208H497 M10 252H502 M15 296H497 M24 340H488 M35 384H477"/>
    <path d="M70 35V440 M118 26V454 M166 22V466 M214 20V468 M262 20V468 M310 20V468 M358 22V466 M406 26V454 M454 35V440"/>
