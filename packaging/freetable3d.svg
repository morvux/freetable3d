  <!-- green triangular solid -->
  <g filter="url(#shadow)" stroke="#e5ffe0" stroke-width="4" stroke-linejoin="round">
    <path d="M393 126L435 201 352 201Z" fill="url(#green)"/>
    <path d="M393 126L394 183 435 201Z" fill="#75d84b"/>
    <path d="M394 183L352 201 435 201Z" fill="#238b40"/>
  </g>
  <!-- Tux penguin mascot, arms raised -->
